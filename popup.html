<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: #15151a; color: #e7e7ea; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; margin: 10px 0 3px; color: #a8a8b2; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
    border: 1px solid #33333d; background: #1e1e26; color: #e7e7ea; font: inherit;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .row input[type=checkbox] { width: 15px; height: 15px; accent-color: #22c55e; }
  .row label { margin: 0; color: #e7e7ea; }
  .checks { display: flex; gap: 14px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 7px 0; border: 0; border-radius: 6px; cursor: pointer;
    font: inherit; font-weight: 600;
  }
  #save { background: #22c55e; color: #0b0b0e; }
  #test { background: #2b2b35; color: #e7e7ea; border: 1px solid #3c3c48; }
  #status { margin-top: 10px; min-height: 16px; font-size: 12px; color: #9bd8ae; word-break: break-all; }
  #last { margin-top: 6px; font-size: 11px; color: #8888a0; word-break: break-all; }
  .hint { font-size: 11px; color: #77778a; margin-top: 4px; }
  .err { color: #f0a3a3 !important; }
</style>
</head>
<body>
  <h1>Whatnot → ntfy</h1>

  <div class="row">
    <input type="checkbox" id="enabled">
    <label for="enabled">Notifications enabled</label>
  </div>

  <label for="server">ntfy server</label>
  <input type="text" id="server" placeholder="https://ntfy.sh">

  <label for="topic">Topic</label>
  <input type="text" id="topic" placeholder="e.g. whatnot-sales-x7k2">
  <div class="hint">Subscribe in the ntfy app / at the server to this topic name. Pick something unguessable.</div>

  <label for="token">Access token <span class="hint">(optional — ntfy token or user:pass)</span></label>
  <input type="password" id="token" autocomplete="off">

  <label for="priority">Priority</label>
  <select id="priority">
    <option value="1">1 — min</option>
    <option value="2">2 — low</option>
    <option value="3">3 — default</option>
    <option value="4" selected>4 — high</option>
    <option value="5">5 — urgent</option>
  </select>

  <label for="minPrice">Min price <span class="hint">(0 = notify on every sale)</span></label>
  <input type="number" id="minPrice" min="0" step="0.01" value="0">

  <div class="row checks">
    <div class="row"><input type="checkbox" id="netDetect"><label for="netDetect">Event feed</label></div>
    <div class="row"><input type="checkbox" id="domDetect"><label for="domDetect">Sold cards</label></div>
    <div class="row"><input type="checkbox" id="hud"><label for="hud">HUD</label></div>
    <div class="row"><input type="checkbox" id="debug"><label for="debug">Debug</label></div>
  </div>
  <div class="hint">"Event feed" reads the page's own data stream (richest detail). "Sold cards" watches the on-screen Sold feed as a fallback. HUD shows an on-page panel; Debug logs detections to the console.</div>

  <div class="btns">
    <button id="save">Save</button>
    <button id="test">Send test</button>
  </div>
  <div id="status"></div>
  <div id="last"></div>

  <script src="popup.js"></script>
</body>
</html>
